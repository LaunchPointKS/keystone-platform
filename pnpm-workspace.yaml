packages:
  - apps/*
  - packages/*
allowBuilds:
  "@prisma/engines": true
  "@scarf/scarf": false
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.6"
  - "@turbo/darwin-arm64@2.11.6"
  - "@turbo/linux-64@2.11.6"
  - "@turbo/linux-arm64@2.11.6"
  - "@turbo/windows-64@2.11.6"
  - "@turbo/windows-arm64@2.11.6"
  - bullmq@6.3.11
  - turbo@2.11.6
